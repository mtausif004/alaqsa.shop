<style>
:root{--bg:#f7f8f5;--card:#fff;--text:#172018;--muted:#6b746c;--brand:#18794e;--brand2:#0f5e3c;--line:#e2e7e2;--danger:#c0392b;--shadow:0 10px 35px rgba(20,50,35,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',system-ui,sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.container{width:min(1160px,calc(100% - 28px));margin:auto}.top{background:#0f3f2b;color:#fff;font-size:13px;padding:7px 0}.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.navin{height:70px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;object-fit:cover;background:#e7efe9}.brand{font-weight:700;line-height:1.05}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.grow{flex:1}.navlinks{display:none;gap:18px;font-size:14px;font-weight:600}.iconbtn{width:42px;height:42px;border-radius:13px;background:#f0f4f0;color:var(--text)}.cartbtn{position:relative;background:var(--brand);color:#fff}.badge{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#e74c3c;color:#fff;font-size:11px;display:grid;place-items:center}.hero{padding:18px 0}.heroCard{min-height:260px;border-radius:26px;overflow:hidden;background:linear-gradient(120deg,#0d4b31,#267f58);color:#fff;display:flex;align-items:center;padding:30px;position:relative;box-shadow:var(--shadow)}.heroCard:after{content:'';position:absolute;inset:auto -80px -100px auto;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}.heroText{max-width:650px;position:relative;z-index:1}.eyebrow{font-size:13px;opacity:.85}.hero h1{font-size:clamp(30px,7vw,54px);line-height:1.05;margin:8px 0}.hero p{font-size:16px;max-width:560px;color:#e5f4ea}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:13px;background:var(--brand);color:#fff;font-weight:700}.btn.light{background:#fff;color:#135b3b}.btn.ghost{background:#edf4ef;color:#155b3c}.section{padding:12px 0 26px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.section h2{font-size:23px;margin:0}.muted{color:var(--muted);font-size:13px}.cats{display:flex;gap:9px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px;font-weight:600;font-size:13px}.chip.active{background:#e4f3ea;border-color:#b9dec8;color:#0d613e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px rgba(20,50,35,.04)}.pimg{aspect-ratio:1/1;background:#eef2ee;position:relative;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover;transition:.25s}.card:hover .pimg img{transform:scale(1.035)}.pbody{padding:12px}.pname{font-weight:700;min-height:43px;line-height:1.25}.price{font-weight:800;color:var(--brand);font-size:18px}.mrp{text-decoration:line-through;color:#9aa29c;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.mini{font-size:12px;color:var(--muted)}.add{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;font-size:20px}.offerGrid{display:grid;grid-template-columns:1fr;gap:12px}.offer{min-height:150px;border-radius:20px;padding:20px;color:#fff;background:linear-gradient(120deg,#7d4e21,#d08c3f);position:relative;overflow:hidden}.offer h3{margin:0 0 4px;font-size:23px}.offer p{margin:0 0 14px;max-width:550px}.search{display:flex;gap:8px;margin:10px 0}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.search select{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.footer{margin-top:35px;background:#10261b;color:#e8f1eb;padding:32px 0}.footergrid{display:grid;gap:22px}.footer h3{margin:0 0 8px}.footer p{color:#b9c8be;margin:4px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:60;display:none;align-items:end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:12px;background:#eef2ef}.detailimg{width:100%;max-height:360px;object-fit:contain;background:#f0f3f0;border-radius:18px}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.form textarea{min-height:85px;resize:vertical}.cartitem{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.cartitem img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#eee}.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:9px;background:#eef3ef}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15251b;color:#fff;padding:11px 15px;border-radius:12px;z-index:100;display:none}.empty{text-align:center;padding:35px 10px;color:var(--muted)}
@media(min-width:720px){.navlinks{display:flex}.navin{height:76px}.heroCard{min-height:340px;padding:50px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.offerGrid{grid-template-columns:repeat(2,1fr)}.footergrid{grid-template-columns:2fr 1fr 1fr}.modal{align-items:center;padding:20px}.sheet{width:min(760px,100%);border-radius:24px}.detailLayout{display:grid;grid-template-columns:1fr 1fr;gap:18px}}
@media(max-width:719px){.container{width:min(100% - 20px,1160px)}.heroCard{padding:24px;min-height:290px}.desktopOnly{display:none!important}}

<body>
<div class="top"><div class="container row"><span>Authentic Burmese & Imported Products</span><span>Cox's Bazar delivery available</span></div></div>
<header class="nav"><div class="container navin"><a href="/alaqsa.shop/" id="logoLink"><img id="logo" class="logo" src="" alt="Al Aqsa Burmese Shop logo"><div class="brand" id="shopName">আল-আকসা বার্মিজ শপ<small>Authentic Burmese Market</small></div></a><div class="grow"></div><nav class="navlinks"><a href="/alaqsa.shop/">হোম</a><a href="/alaqsa.shop/category/">ক্যাটাগরি</a><a href="/alaqsa.shop/offers/">অফার</a></nav><button class="iconbtn cartbtn" id="cartBtn" aria-label="Cart">🛒<span id="cartCount" class="badge">0</span></button></div></header>
<main class="container" id="app"></main>
<footer class="footer"><div class="container footergrid"><div><h3 id="footerName">আল-আকসা বার্মিজ শপ</h3><p>শতভাগ অথেনটিক বার্মিজ ও ইমপোর্টেড পণ্যের সমাহার।</p></div><div><h3>যোগাযোগ</h3><p id="footerAddress">Cox's Bazar, Bangladesh</p><p id="footerHotline"></p></div><div><h3>দ্রুত লিংক</h3><p><a href="/alaqsa.shop/category/">সব ক্যাটাগরি</a></p><p><a href="/alaqsa.shop/offers/">চলমান অফার</a></p></div></div></footer>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbzTu536zNamjE99oit02MBE3yBhDyev18WCzHVgYliZIRFq7u1tx_LShdfceQ0T_w/exec';
let API=localStorage.getItem('alqsa_backend_url')||DEFAULT_API, products=[],categories=[],banners=[],offers=[],settings={},cart=JSON.parse(localStorage.getItem('alqsa_cart')||'{}');
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2500)}
function saveCart(){localStorage.setItem('alqsa_cart',JSON.stringify(cart));$('#cartCount').textContent=Object.values(cart).reduce((a,b)=>a+Number(b),0)}
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});const d=await r.json();if(!d.success)throw new Error(d.error||'Request failed');return d}
async function load(){try{const d=await api('publicCatalog');products=d.products||[];categories=d.categories||[];banners=d.banners||[];offers=d.offers||[];if(!products.length)products=await loadJSON('products.json');if(!categories.length)categories=await loadJSON('categories.json')}catch(e){products=await loadJSON('products.json');categories=await loadJSON('categories.json');banners=[];offers=[]}try{const d=await api('publicConfig');settings=d.settings||{}}catch(e){try{settings=await loadJSON('settings.json')}catch(_){settings={}}}applyBranding();saveCart();render()}
async function loadJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('fallback unavailable');return r.json()}
function applyBranding(){const name=settings.shopName||'আল-আকসা বার্মিজ শপ';$('#shopName').firstChild.nodeValue=name;$('#footerName').textContent=name;$('#footerAddress').textContent=settings.address||"Cox's Bazar, Bangladesh";$('#footerHotline').textContent=settings.hotline||'';if(settings.logo){$('#logo').src=settings.logo}else{$('#logo').style.display='none'}document.body.style.fontFamily=`'${settings.shopFont||'Hind Siliguri'}',sans-serif`}
function route(){const p=location.pathname.replace(/^\/alaqsa\.shop/,'').replace(/\/+$/,'')||'/';if(p==='/')return home();if(p==='/offers')return offersPage();if(p==='/category')return categoryPage();if(p.startsWith('/category/'))return categoryPage(decodeURIComponent(p.split('/')[2]||''));if(p.startsWith('/product/'))return productPage(decodeURIComponent(p.split('/')[2]||''));return home()}
function render(){updateSEO();route()}
function updateSEO(title,desc,path){const t=title||"Al Aqsa Burmese Shop | Authentic Burmese Products",d=desc||"Buy authentic Burmese products, Thanaka, pickles and snacks online. Enjoy Cox's Bazar delivery and easy Burmese market shopping.";document.title=t;document.querySelector('meta[name="description"]').content=d;document.querySelector('link[rel="canonical"]').href='https://mtausif004.github.io/alaqsa.shop'+(path||'/');document.querySelector('meta[property="og:title"]').content=t;document.querySelector('meta[property="og:description"]').content=d;document.querySelector('meta[property="og:url"]').content=location.href.split('#')[0]}
function bannerMarkup(){if(!banners.length)return '';const b=banners.slice().sort((x,y)=>(Number(x['Sort Order'])||0)-(Number(y['Sort Order'])||0))[0];return `<section class="hero"><div class="heroCard" style="${b.Image?`background-image:linear-gradient(90deg,rgba(8,35,22,.88),rgba(8,35,22,.28)),url('${esc(b.Image)}');background-size:cover;background-position:center`:''}"><div class="heroText"><div class="eyebrow">${esc(b.Theme||'SPECIAL OFFER')}</div><h1>${esc(b.Title||'বিশেষ অফার')}</h1><p>${esc(b['Button Text']||'আজকের বিশেষ অফার')}</p>${b.Link?`<a class="btn light" href="${esc(b.Link)}">${esc(b['Button Text']||'Shop now')}</a>`:''}</div></div></section>`}
function home(){updateSEO();const cats=categories.slice().sort((a,b)=>(Number(a['Sort Order'])||0)-(Number(b['Sort Order'])||0)).filter(c=>String(c.Active)!=='FALSE');const featured=products.filter(p=>String(p.Featured).toUpperCase()==='TRUE');const list=(featured.length?featured:products).slice(0,8);$('#app').innerHTML=`${bannerMarkup()}<section class="hero"><div class="heroCard"><div class="heroText"><div class="eyebrow">AUTHENTIC BURMESE MARKET</div><h1>বার্মিজ স্বাদের খাঁটি সংগ্রহ</h1><p>থানাকা, চন্দন, আচার, বালাচাও, চকলেট, কফি ও আরও অনেক প্রিমিয়াম পণ্য—ঘরে বসেই অর্ডার করুন।</p><a class="btn light" href="/alaqsa.shop/category/">ক্যাটাগরি দেখুন</a></div></div></section><section class="section"><div class="sectionhead"><div><h2>ক্যাটাগরি</h2><div class="muted">আপনার পছন্দের বিভাগ বেছে নিন</div></div><a class="muted" href="/alaqsa.shop/category/">সব দেখুন →</a></div><div class="cats">${cats.map(c=>`<a class="chip" href="/alaqsa.shop/category/${encodeURIComponent(c.Name)}">${esc(c.Name)}</a>`).join('')}</div></section>${offers.length?`<section class="section"><div class="sectionhead"><div><h2>চলমান অফার</h2><div class="muted">আজকের বিশেষ ডিল</div></div><a class="muted" href="/alaqsa.shop/offers/">সব অফার →</a></div><div class="offerGrid">${offers.slice(0,2).map(offerCard).join('')}</div></section>`:''}<section class="section"><div class="sectionhead"><div><h2>জনপ্রিয় পণ্য</h2><div class="muted">নতুন ও জনপ্রিয় পছন্দ</div></div></div><div class="grid">${list.map(productCard).join('')}</div></section>`}
function categoryPage(name=''){const active=name?categories.find(c=>c.Name===name):null;const title=active?active.Name:'Burmese Product Categories';let desc='Explore authentic Burmese food, cosmetics, Thanaka, sandalwood, coffee and imported products.';if(name==='স্কিন কেয়ার ও কসমেটিকস'){updateSEO('Burmese Cosmetics | Thanaka & Sandalwood Online','Buy authentic Thanaka online, Burmese sandalwood and skincare products with convenient delivery from Al Aqsa Burmese Shop.','/category/'+encodeURIComponent(name))}else if(name==='আচার ও চাটনি'){updateSEO('Burmese Pickles & Chutneys | Authentic Achar',"Discover the best Burmese pickles, achar and chutneys online. Shop authentic flavors with Cox's Bazar delivery from Al Aqsa Burmese Shop.",'/category/'+encodeURIComponent(name))}else updateSEO(title+' | Al Aqsa Burmese Shop',desc,'/category/'+(name?encodeURIComponent(name):''));const list=name?products.filter(p=>p.Category===name):products;$('#app').innerHTML=`<section class="section"><div class="sectionhead"><div><h2>${esc(title)}</h2><div class="muted">${name?'Subcategories: '+esc((active?.Subcategories||'').toString().replaceAll('|',' · ')):'সব পণ্য বিভাগ'}</div></div></div><div class="search"><input id="q" placeholder="পণ্য খুঁজুন..." oninput="filterProducts()"><select id="sort" onchange="filterProducts()"><option value="default">সাজানো: ডিফল্ট</option><option value="low">কম দাম</option><option value="high">বেশি দাম</option><option value="name">নাম</option></select></div><div class="grid" id="productGrid">${list.map(productCard).join('')}</div></section>`;window._categoryList=list}
function filterProducts(){let a=[...window._categoryList||products],q=$('#q').value.toLowerCase();a=a.filter(p=>(p.Name+' '+p.Brand+' '+p.Subcategory).toLowerCase().includes(q));const s=$('#sort').value;if(s==='low')a.sort((x,y)=>Number(x.Price)-Number(y.Price));if(s==='high')a.sort((x,y)=>Number(y.Price)-Number(x.Price));if(s==='name')a.sort((x,y)=>String(x.Name).localeCompare(String(y.Name),'bn'));$('#productGrid').innerHTML=a.map(productCard).join('')}
function productPage(id){const p=products.find(x=>x['Product ID']===id);if(!p){$('#app').innerHTML='<div class="empty">পণ্য পাওয়া যায়নি।</div>';return}updateSEO((p.Name||'Product')+' | Al Aqsa Burmese Shop',`Buy ${p.Name||'authentic Burmese product'} online from Al Aqsa Burmese Shop. Product ID ${id}.`,'/product/'+encodeURIComponent(id));const imgs=parseImages(p);$('#app').innerHTML=`<section class="section"><div class="detailLayout"><div><img class="detailimg" src="${esc(imgs[0]||'')}" alt="${esc(p.Name)}"></div><div><div class="mini">${esc(p.Category||'')} · ${esc(p.Subcategory||'')}</div><h1>${esc(p.Name)}</h1><p class="price">${money(p.Price)}</p>${Number(p.MRP)>Number(p.Price)?`<p class="mrp">MRP ${money(p.MRP)}</p>`:''}<p>${esc(p.Description||'')}</p><div class="row"><button class="btn" onclick="add('${esc(p['Product ID'])}')">কার্টে যোগ করুন</button><button class="btn ghost" onclick="shareProduct('${esc(p['Product ID'])}')">শেয়ার</button></div></div></div></section>`}
function offersPage(){updateSEO('Offers | Al Aqsa Burmese Shop','See current Burmese product offers, discounts and special deals from Al Aqsa Burmese Shop.','/offers/');$('#app').innerHTML=`<section class="section"><div class="sectionhead"><div><h2>অফার</h2><div class="muted">চলমান বিশেষ অফার ও ডিল</div></div></div><div class="offerGrid">${offers.length?offers.map(offerCard).join(''):'<div class="empty">এই মুহূর্তে কোনো অফার নেই।</div>'}</div></section>`}
function offerCard(o){return `<article class="offer" style="${o.Image?`background-image:linear-gradient(90deg,rgba(10,30,18,.82),rgba(10,30,18,.25)),url('${esc(o.Image)}');background-size:cover;background-position:center`:''}"><h3>${esc(o.Title)}</h3><p>${esc(o.Subtitle||o.Description||'')}</p>${o.Link?`<a class="btn light" href="${esc(o.Link)}">${esc(o['Button Text']||'Shop now')}</a>`:''}</article>`}
function productCard(p){const id=p['Product ID'],img=parseImages(p)[0]||'';return `<article class="card"><a href="/alaqsa.shop/product/${encodeURIComponent(id)}"><div class="pimg"><img src="${esc(img)}" alt="${esc(p.Name)}" loading="lazy"></div></a><div class="pbody"><div class="mini">${esc(p.Brand||p.Category||'')}</div><a class="pname" href="/alaqsa.shop/product/${encodeURIComponent(id)}">${esc(p.Name)}</a><div class="row"><div><div class="price">${money(p.Price)}</div>${Number(p.MRP)>Number(p.Price)?`<div class="mrp">${money(p.MRP)}</div>`:''}</div><button class="add" onclick="event.preventDefault();add('${esc(id)}')">+</button></div></div></article>`}
function parseImages(p){try{const a=JSON.parse(p.Images||'[]');if(Array.isArray(a)&&a.length)return a}catch(e){}return [p.image,p.Image,p.imageUrl].filter(Boolean)}
function add(id){cart[id]=Number(cart[id]||0)+1;saveCart();toast('কার্টে যোগ হয়েছে');}
function openCart(){const items=products.filter(p=>Number(cart[p['Product ID']]||0)>0);const sub=items.reduce((s,p)=>s+Number(p.Price||0)*Number(cart[p['Product ID']]),0);$('#sheet').innerHTML=`<div class="sheethead"><h2>আপনার কার্ট</h2><button class="close" onclick="closeModal()">×</button></div>${items.length?items.map(p=>`<div class="cartitem"><img src="${esc(parseImages(p)[0]||'')}" alt=""><div><b>${esc(p.Name)}</b><div class="mini">${money(p.Price)} × ${cart[p['Product ID']]}</div></div><div class="qty"><button onclick="changeQty('${esc(p['Product ID'])}',-1)">−</button><b>${cart[p['Product ID']]}</b><button onclick="changeQty('${esc(p['Product ID'])}',1)">+</button></div></div>`).join(''):`<div class="empty">কার্ট খালি</div>`}${items.length?`<div class="row" style="padding:15px 0"><b>Subtotal</b><b>${money(sub)}</b></div><button class="btn" style="width:100%" onclick="checkout()">Checkout</button>`:''}`;$('#modal').classList.add('open')}
function changeQty(id,n){cart[id]=Number(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];saveCart();openCart()}
function checkout(){const items=products.filter(p=>Number(cart[p['Product ID']]||0)>0),sub=items.reduce((s,p)=>s+Number(p.Price||0)*Number(cart[p['Product ID']]),0);$('#sheet').innerHTML=`<div class="sheethead"><h2>অর্ডার করুন</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Subtotal: ${money(sub)}</p><div class="form"><label>নাম<input id="cName" required></label><label>মোবাইল<input id="cPhone" inputmode="tel" required></label><label>ডেলিভারি এলাকা<select id="cZone"><option value="Inside Cox’s Bazar">Inside Cox’s Bazar</option><option value="Outside Cox’s Bazar">Outside Cox’s Bazar</option></select></label><label>সম্পূর্ণ ঠিকানা<textarea id="cAddress" required></textarea></label><label>নোট (ঐচ্ছিক)<textarea id="cNote"></textarea></label><button class="btn" onclick="submitOrder()">অর্ডার কনফার্ম করুন</button></div>`}
async function submitOrder(){const name=$('#cName').value.trim(),phone=$('#cPhone').value.trim(),zone=$('#cZone').value,address=$('#cAddress').value.trim(),note=$('#cNote').value.trim();if(!name||!phone||!address){toast('নাম, মোবাইল ও সম্পূর্ণ ঠিকানা দিন');return}const items=products.filter(p=>Number(cart[p['Product ID']]||0)>0).map(p=>({productId:p['Product ID'],productName:p.Name,category:p.Category,price:Number(p.Price)||0,quantity:Number(cart[p['Product ID']])}));const charge=zone==='Inside Cox’s Bazar'?Number(settings.insideCharge||0):Number(settings.outsideCharge||0);try{const d=await api('createOrder',{customer:{name,phone,whatsapp:settings.whatsapp||'',address,note},deliveryZone:zone,deliveryCharge:charge,note,items,source:'website'});cart={};saveCart();$('#sheet').innerHTML=`<div class="empty"><h2>অর্ডার সফল হয়েছে 🎉</h2><p>আপনার Order ID: <b>${esc(d.orderId)}</b></p><button class="btn" onclick="closeModal()">ঠিক আছে</button></div>`;toast('অর্ডার সফল হয়েছে')}catch(e){toast('অর্ডার পাঠানো যায়নি: '+e.message)}}
function shareProduct(id){const p=products.find(x=>x['Product ID']===id);const url=location.origin+location.pathname.replace(/\/product\/.*$/,'/product/'+encodeURIComponent(id));const text=`🛍️ ${p?.Name||'Product'}\n\n🆔 Product ID: ${id}\n\n🔗 Product Link:\n${url}`;if(navigator.share)navigator.share({title:p?.Name,text,url}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>toast('শেয়ার মেসেজ কপি হয়েছে'))}
function closeModal(){$('#modal').classList.remove('open')}
$('#cartBtn').onclick=openCart;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};window.addEventListener('popstate',render);window.addEventListener('click',e=>{const a=e.target.closest('a[href^="/alaqsa.shop/"]');if(a&&a.target!=='_blank'){e.preventDefault();history.pushState({},'',a.getAttribute('href'));render()}});load();
</script>
