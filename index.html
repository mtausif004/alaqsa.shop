const $=id=>document.getElementById(id);let S={shopName:'আল-আকসা বার্মিজ শপ',products:[],coupons:[],settings:{},reviews:[]},cart=JSON.parse(localStorage.getItem('aqCart')||'[]'),activeCat='',activeProduct=null,discount=0,discountCode='';
const money=n=>`${S.settings.currency||'৳'}${Number(n||0).toLocaleString('en-BD')}`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),2500)};
async function getJSON(file){const r=await fetch(`${file}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(file+' load failed');return r.json()}
async function init(){try{const [p,s,r]=await Promise.all([getJSON('products.json'),getJSON('settings.json'),getJSON('reviews.json')]);S.products=p.products||[];S.coupons=p.coupons||[];S.settings=s||{};S.reviews=r.reviews||[];renderSettings();renderCats();renderProducts();renderCart();renderRecent();renderFAQ();renderReviews();}catch(e){toast('Catalog load করতে সমস্যা হয়েছে');console.error(e)}}
function renderSettings(){document.title=S.settings.shopName||S.shopName;$('announcement').textContent=S.settings.announcement||'';$('shopName').textContent=S.settings.shopName||S.shopName;$('tagline').textContent=S.settings.tagline||'';$('footerName').textContent=S.settings.shopName||S.shopName;$('heroTitle').textContent=S.settings.heroTitle||'';$('heroText').textContent=S.settings.heroText||'';$('heroBtn').textContent=S.settings.heroButton||'পণ্য দেখুন';if(S.settings.logo)$('logoBox').innerHTML=`<img src="${esc(S.settings.logo)}" class="h-full w-full object-cover" alt="logo">`;if(S.settings.heroImage){$('heroImage').src=S.settings.heroImage;$('heroImage').classList.remove('hidden')}$('trust').innerHTML=(S.settings.trustItems||[]).slice(0,4).map(x=>`<div class="rounded-2xl border bg-white p-4"><div class="mb-2 grid h-9 w-9 place-items-center rounded-xl bg-emerald-50 text-emerald-600"><i class="fa-solid fa-circle-check"></i></div><b class="text-sm">${esc(x)}</b></div>`).join('');if(S.settings.facebook){$('fb').href=S.settings.facebook;$('fb').classList.remove('hidden')}if(S.settings.instagram){$('ig').href=S.settings.instagram;$('ig').classList.remove('hidden')}$('year').textContent=new Date().getFullYear()}
function categories(){return [...new Set(S.products.map(p=>p.category).filter(Boolean))]}
function renderCats(){const cats=categories();const html=cats.map(c=>`<button data-cat="${esc(c)}" class="catBtn shrink-0 rounded-full border bg-white px-4 py-2 text-sm font-bold">${esc(c)}</button>`).join('');$('filters').innerHTML=`<button data-cat="" class="catBtn shrink-0 rounded-full bg-slate-900 px-4 py-2 text-sm font-bold text-white">সব</button>${html}`;$('mobileCats').innerHTML=`<button data-cat="" class="catBtn rounded-full bg-slate-900 px-3 py-2 text-xs font-bold text-white">সব</button>${html}`;document.querySelectorAll('.catBtn').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderProducts();document.querySelectorAll('.catBtn').forEach(x=>x.classList.toggle('bg-slate-900',x.dataset.cat===activeCat));document.querySelectorAll('.catBtn').forEach(x=>x.classList.toggle('text-white',x.dataset.cat===activeCat))})}
function filtered(){let q=$('search').value.trim().toLowerCase(),stock=$('inStock').checked||$('mobileStock').checked,sort=$('sort').value||$('mobileSort').value||'featured';let a=S.products.filter(p=>p.active!==false&&(!activeCat||p.category===activeCat)&&(!stock||(Number(p.stock||0)>0||p.stock===undefined))&&(!q||[p.name,p.brand,p.category,p.description,...(p.specs||[])].join(' ').toLowerCase().includes(q)));if(sort==='low')a.sort((x,y)=>x.price-y.price);if(sort==='high')a.sort((x,y)=>y.price-x.price);if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));if(sort==='featured')a.sort((x,y)=>Number(y.featured)-Number(x.featured));return a}
function renderProducts(){const a=filtered();$('resultCount').textContent=`${a.length}টি পণ্য`;if(!a.length){$('productGrid').innerHTML='<div class="col-span-full rounded-3xl bg-white p-12 text-center text-slate-500">কোনো matching product পাওয়া যায়নি।</div>';return}$('productGrid').innerHTML=a.map(p=>{let out=p.stock!==undefined&&Number(p.stock)<=0;return `<article class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-soft"><button class="relative block aspect-square w-full overflow-hidden bg-slate-100" onclick="openProduct('${esc(p.id)}')"><img src="${esc(p.images?.[0]||'https://placehold.co/600x600?text=No+Image')}" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" alt="${esc(p.name)}"><div class="absolute left-2 top-2 flex flex-wrap gap-1">${p.featured?'<span class="rounded-full bg-amber-400 px-2 py-1 text-[10px] font-black">FEATURED</span>':''}${p.comparePrice>p.price?'<span class="rounded-full bg-rose-500 px-2 py-1 text-[10px] font-black text-white">SALE</span>':''}</div><span class="absolute right-2 top-2 rounded-full bg-white/90 px-2 py-1 text-[10px] font-bold">${p.images?.length||1} ছবি</span>${out?'<div class="absolute inset-0 grid place-items-center bg-slate-950/55 text-white"><b class="rounded-full bg-white/10 px-3 py-2">SOLD OUT</b></div>':''}</button><div class="p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">${esc(p.brand||p.category||'Product')}</p><h3 class="mt-1 line-clamp-2 min-h-10 text-sm font-black">${esc(p.name)}</h3><div class="mt-2 flex items-center gap-2"><b class="text-base">${money(p.price)}</b>${p.comparePrice>p.price?`<del class="text-xs text-slate-400">${money(p.comparePrice)}</del>`:''}</div><button ${out?'disabled':''} onclick="addToCart('${esc(p.id)}')" class="mt-3 w-full rounded-xl ${out?'bg-slate-100 text-slate-400':'bg-slate-900 text-white'} px-3 py-2.5 text-xs font-black">${out?'Sold out':'কার্টে যোগ করুন'}</button></div></article>`}).join('')}
function openProduct(id){activeProduct=S.products.find(p=>p.id===id);if(!activeProduct)return;localStorage.setItem('aqRecent',JSON.stringify([id,...JSON.parse(localStorage.getItem('aqRecent')||'[]').filter(x=>x!==id)].slice(0,8)));$('modalTitle').textContent=activeProduct.name;$('modalPrice').textContent=money(activeProduct.price);$('modalCompare').textContent=activeProduct.comparePrice>activeProduct.price?money(activeProduct.comparePrice):'';$('modalDesc').textContent=activeProduct.description||'এই পণ্যের বিস্তারিত description দেওয়া হয়নি।';$('modalBadges').innerHTML=`${activeProduct.brand?`<span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold">${esc(activeProduct.brand)}</span>`:''}${activeProduct.category?`<span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold">${esc(activeProduct.category)}</span>`:''}${activeProduct.stock!==undefined?`<span class="rounded-full ${Number(activeProduct.stock)>0?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'} px-3 py-1 text-xs font-bold">${Number(activeProduct.stock)>0?`Stock: ${activeProduct.stock}`:'Sold out'}</span>`:''}`;$('modalSpecs').innerHTML=(activeProduct.specs||[]).map(x=>{let [k,...v]=x.split(':');return `<div class="grid grid-cols-2 border-b p-3 text-sm last:border-0"><span class="font-bold text-slate-500">${esc(k)}</span><span class="font-semibold">${esc(v.join(':').trim())||esc(k)}</span></div>`}).join('')||'<p class="p-3 text-sm text-slate-500">Specifications নেই।</p>';$('modalThumbs').innerHTML=(activeProduct.images||[]).map((src,i)=>`<button onclick="setModalImage('${esc(src)}')" class="h-16 w-16 shrink-0 overflow-hidden rounded-xl border-2 ${i===0?'border-slate-900':'border-transparent'}"><img src="${esc(src)}" class="h-full w-full object-cover"></button>`).join('');setModalImage(activeProduct.images?.[0]);$('modalAdd').disabled=activeProduct.stock!==undefined&&Number(activeProduct.stock)<=0;$('modalAdd').classList.toggle('opacity-50',$('modalAdd').disabled);$('modalWish').innerHTML=wishlist().includes(id)?'<i class="fa-solid fa-heart text-rose-500"></i>':'<i class="fa-regular fa-heart"></i>';$('productModal').classList.remove('hidden')}
function setModalImage(src){if(!src)return;$('modalImage').src=src;$('zoomBtn').onclick=()=>{$('lightImg').src=src;$('lightbox').classList.remove('hidden')}}
function wishlist(){return JSON.parse(localStorage.getItem('aqWish')||'[]')}
function toggleWish(){if(!activeProduct)return;let a=wishlist(),i=a.indexOf(activeProduct.id);i>=0?a.splice(i,1):a.push(activeProduct.id);localStorage.setItem('aqWish',JSON.stringify(a));$('modalWish').innerHTML=a.includes(activeProduct.id)?'<i class="fa-solid fa-heart text-rose-500"></i>':'<i class="fa-regular fa-heart"></i>';toast(i>=0?'Wishlist থেকে বাদ':'Wishlist-এ যোগ হয়েছে')}
function addToCart(id){const p=S.products.find(x=>x.id===id);if(!p)return;if(p.stock!==undefined&&Number(p.stock)<=0)return toast('এই পণ্যটি এখন available নয়');let x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id,qty:1});saveCart();toast('Cart-এ যোগ হয়েছে');}
function saveCart(){localStorage.setItem('aqCart',JSON.stringify(cart));renderCart()}
function renderCart(){const count=cart.reduce((a,x)=>a+x.qty,0);$('cartCount').textContent=count;$('cartMeta').textContent=`${count}টি item`;let sub=0;$('cartItems').innerHTML=cart.length?cart.map(i=>{let p=S.products.find(x=>x.id===i.id);if(!p)return '';sub+=p.price*i.qty;return `<div class="mb-3 flex gap-3 rounded-2xl border p-3"><img src="${esc(p.images?.[0]||'https://placehold.co/120')}" class="h-16 w-16 rounded-xl object-cover"><div class="min-w-0 flex-1"><b class="line-clamp-2 text-sm">${esc(p.name)}</b><div class="mt-1 text-sm font-black">${money(p.price*i.qty)}</div><div class="mt-2 flex items-center gap-2"><button onclick="changeQty('${esc(i.id)}',-1)" class="grid h-8 w-8 place-items-center rounded-lg border">−</button><span class="w-6 text-center text-sm font-bold">${i.qty}</span><button onclick="changeQty('${esc(i.id)}',1)" class="grid h-8 w-8 place-items-center rounded-lg border">+</button><button onclick="removeCart('${esc(i.id)}')" class="ml-auto text-xs font-bold text-rose-600">Remove</button></div></div></div>`}).join(''):'<div class="grid h-full place-items-center text-center text-slate-400"><div><i class="fa-solid fa-bag-shopping text-4xl"></i><p class="mt-3 font-bold">Cart খালি</p></div></div>';let d=discount;let zone=$('deliveryZone')?.value||'inside',dc=zone==='outside'?Number(S.settings.outsideDelivery||0):Number(S.settings.insideDelivery||0);if(Number(S.settings.freeDeliveryMin)>0&&sub>=Number(S.settings.freeDeliveryMin))dc=0;$('subtotal').textContent=money(sub);$('discount').textContent=`- ${money(d)}`;$('delivery').textContent=money(cart.length?dc:0);$('total').textContent=money(Math.max(0,sub-d+(cart.length?dc:0)))}
function changeQty(id,n){let x=cart.find(i=>i.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);saveCart()}function removeCart(id){cart=cart.filter(i=>i.id!==id);saveCart()}
function invoice(){let name=$('cName').value.trim(),phone=$('cPhone').value.trim(),address=$('cAddress').value.trim();if(!cart.length)throw Error('Cart খালি');if(!name||!phone||!address)throw Error('নাম, ফোন ও ঠিকানা পূরণ করুন');let sub=cart.reduce((a,i)=>a+(S.products.find(p=>p.id===i.id)?.price||0)*i.qty,0),zone=$('deliveryZone').value,dc=zone==='outside'?Number(S.settings.outsideDelivery||0):Number(S.settings.insideDelivery||0);if(Number(S.settings.freeDeliveryMin)>0&&sub>=Number(S.settings.freeDeliveryMin))dc=0;let total=Math.max(0,sub-discount+dc),order='AQ-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();let lines=[`*${S.settings.shopName||'আল-আকসা বার্মিজ শপ'}*`,`*ORDER INVOICE*`,`Order ID: ${order}`,`Date: ${new Date().toLocaleString('en-BD')}`,'',`Customer: ${name}`,`Phone: ${phone}`,`Address: ${address}`,`Delivery: ${zone==='outside'?'Outside Chattogram':'Inside Chattogram'}`,'','*Items*',...cart.map(i=>{let p=S.products.find(x=>x.id===i.id);return `• ${p.name} × ${i.qty} = ${money(p.price*i.qty)}`}),'',`Subtotal: ${money(sub)}`,`Discount${discountCode?` (${discountCode})`:''}: -${money(discount)}`,`Delivery: ${money(dc)}`,`*TOTAL: ${money(total)}*`];let note=$('cNote').value.trim();if(note)lines.push('',`Note: ${note}`);lines.push('','Order request — payment will be confirmed separately.');return {text:lines.join('\n'),order,total}}
function applyCoupon(){let code=$('coupon').value.trim().toUpperCase(),sub=cart.reduce((a,i)=>a+(S.products.find(p=>p.id===i.id)?.price||0)*i.qty,0),c=S.coupons.find(x=>x.active!==false&&x.code===code);if(!c)return discount=0,discountCode='',renderCart(),$('couponMsg').textContent='Coupon পাওয়া যায়নি';if(sub<Number(c.minOrder||0))return $('couponMsg').textContent=`Minimum order ${money(c.minOrder)} লাগবে`;discount=c.type==='percent'?sub*Number(c.value)/100:Math.min(sub,Number(c.value));discountCode=code;$('couponMsg').textContent=`${code} applied ✓`;renderCart()}
async function sendWhats(){try{let x=invoice();await navigator.clipboard?.writeText(x.text).catch(()=>{});location.href=`https://wa.me/${S.settings.whatsapp}?text=${encodeURIComponent(x.text)}`}catch(e){toast(e.message)}}async function messenger(){try{let x=invoice();await navigator.clipboard.writeText(x.text);toast('Invoice copy হয়েছে — Messenger খুলছি');setTimeout(()=>window.open(S.settings.messenger,'_blank'),400)}catch(e){toast(e.message)}}async function copyInvoice(){try{let x=invoice();await navigator.clipboard.writeText(x.text);toast('Invoice copied ✓')}catch(e){toast(e.message)}}
function renderRecent(){let ids=JSON.parse(localStorage.getItem('aqRecent')||'[]'),a=ids.map(id=>S.products.find(p=>p.id===id)).filter(p=>p&&p.active!==false).slice(0,4);if(!a.length)return;$('recentSection').classList.remove('hidden');$('recentProducts').innerHTML=a.map(p=>`<button onclick="openProduct('${esc(p.id)}')" class="overflow-hidden rounded-2xl border bg-white text-left"><img src="${esc(p.images?.[0]||'https://placehold.co/400')}" class="aspect-square w-full object-cover"><div class="p-3"><b class="line-clamp-2 text-sm">${esc(p.name)}</b><span class="mt-1 block text-sm font-black">${money(p.price)}</span></div></button>`).join('')}
function renderFAQ(){$('faq').innerHTML=(S.settings.faq||[]).map((x,i)=>`<details class="py-4"><summary class="cursor-pointer font-bold">${esc(x.q)}</summary><p class="mt-2 text-sm leading-6 text-slate-600">${esc(x.a)}</p></details>`).join('')}
function renderReviews(){$('reviews').innerHTML=S.reviews.filter(x=>x.active!==false).slice(0,6).map(x=>`<article class="rounded-2xl bg-white/10 p-4"><div class="text-amber-300">${'★'.repeat(Math.min(5,Math.max(1,Number(x.rating||5))))}</div><p class="mt-2 text-sm text-slate-200">“${esc(x.text)}”</p><b class="mt-3 block text-xs">— ${esc(x.name||'Customer')}</b></article>`).join('')||'<p class="text-sm text-slate-400">Customer reviews শীঘ্রই আসবে।</p>'}
$('search').oninput=renderProducts;$('sort').onchange=renderProducts;$('mobileSort').onchange=renderProducts;$('inStock').onchange=renderProducts;$('mobileStock').onchange=renderProducts;$('filterToggle').onclick=()=>{$('mobileFilters').classList.toggle('hidden')};$('heroBtn').onclick=()=>document.querySelector('#productGrid').scrollIntoView({behavior:'smooth'});$('cartBtn').onclick=()=>{$('cartPanel').classList.remove('translate-x-full');$('cartBackdrop').classList.remove('hidden')};$('closeCart').onclick=closeCart=$=>{$('cartPanel').classList.add('translate-x-full');$('cartBackdrop').classList.add('hidden')};$('cartBackdrop').onclick=closeCart;$('closeModal').onclick=()=>{$('productModal').classList.add('hidden')};$('closeLight').onclick=()=>{$('lightbox').classList.add('hidden')};$('modalAdd').onclick=()=>{if(activeProduct){addToCart(activeProduct.id);$('productModal').classList.add('hidden');$('cartPanel').classList.remove('translate-x-full');$('cartBackdrop').classList.remove('hidden')}};$('modalWish').onclick=toggleWish;$('applyCoupon').onclick=applyCoupon;$('waOrder').onclick=sendWhats;$('msgOrder').onclick=messenger;$('copyInvoice').onclick=copyInvoice;$('deliveryZone').onchange=renderCart;$('helpBtn').onclick=()=>window.open(`https://wa.me/${S.settings.whatsapp}`,'_blank');$('footerWhats').onclick=()=>window.open(`https://wa.me/${S.settings.whatsapp}`,'_blank');setInterval(init,30000);init();
</script></body></html>
