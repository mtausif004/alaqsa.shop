<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Al Aqsa Burmese Shop</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f7f6;--card:#fff;--text:#18201b;--muted:#6c756f;--line:#dfe6e1;--brand:#18794e;--danger:#c0392b;--shadow:0 8px 28px rgba(20,50,35,.07)}[data-theme=dark]{--bg:#1d211f;--card:#272c29;--text:#edf3ee;--muted:#aab5ae;--line:#3a433e;--shadow:0 8px 28px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.logo{width:54px;height:54px;border-radius:16px;background:#e9f2eb;display:grid;place-items:center;color:var(--brand);font-size:24px;margin-bottom:12px}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:700}.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}.textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:#fff;font-weight:700}.btn.secondary{background:#eaf1ec;color:#155b3d}.btn.danger{background:#fbeceb;color:#a62e24}.muted{color:var(--muted);font-size:13px}.app{min-height:100vh}.topbar{height:64px;position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}.hamb{width:42px;height:42px;border:0;border-radius:12px;background:#eef2ef}.topbar h1{font-size:17px;margin:0}.topbar small{display:block;color:var(--muted);font-size:11px}.grow{flex:1}.shell{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:235px;background:var(--card);border-right:1px solid var(--line);padding:14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.navbtn{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:11px;margin:2px 0;font-weight:600}.navbtn.active{background:#e5f2e9;color:#0e633f}.content{flex:1;padding:18px;min-width:0}.drawer{position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(300px,84vw);background:var(--card);transform:translateX(-105%);transition:.25s;padding:16px;box-shadow:12px 0 35px rgba(0,0,0,.2)}.drawer.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45;display:none}.overlay.open{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:25px;display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:21px}.actions{display:flex;flex-wrap:wrap;gap:7px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9f2eb;color:#155b3d;font-size:11px;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.span2{grid-column:1/-1}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card)}.tab.active{background:#e5f2e9;color:#0e633f;border-color:#b9dcc7}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.toast{position:fixed;right:15px;bottom:15px;z-index:100;background:#16231b;color:#fff;padding:11px 14px;border-radius:12px;display:none}.notice{padding:11px 12px;border-radius:12px;background:#fff7df;color:#7a5a00;border:1px solid #ead89d;font-size:13px;margin-bottom:12px}
@media(max-width:760px){.sidebar{display:none}.content{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.table{min-width:720px}.desktopOnly{display:none!important}}@media(min-width:761px){.hamb{display:none}.drawer,.overlay{display:none!important}.grid.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body>
<section id="login" class="login"><div class="loginbox"><div class="logo">🛍️</div><h1>আল-আকসা বার্মিজ শপ</h1><p class="muted">Secure Admin Panel</p><div id="loginErr" class="notice hidden"></div><form id="loginForm" class="form"><label>User ID<input id="username" class="input" autocomplete="username" required value="mtausif004"></label><label>Password<input id="password" type="password" class="input" autocomplete="current-password" required></label><button class="btn">প্রবেশ করুন</button></form><p class="muted">Backend URL login page-এ নেই; এটি Settings → Backend-এ পরিবর্তনযোগ্য।</p></div></section>
<div id="app" class="app hidden"><header class="topbar"><button class="hamb" id="hamb">☰</button><div><h1>Admin Control Center</h1><small>আল-আকসা বার্মিজ শপ</small></div><div class="grow"></div><button class="hamb" id="theme">◐</button><a class="btn secondary desktopOnly" href="/alaqsa.shop/" target="_blank">Store</a><button class="btn danger" id="logout">Logout</button></header><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="content" id="content"></main></div></div>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="sectionhead"><b>Menu</b><button class="hamb" id="closeDrawer">×</button></div><div id="drawerNav"></div></aside><div class="toast" id="toast"></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbzTu536zNamjE99oit02MBE3yBhDyev18WCzHVgYliZIRFq7u1tx_LShdfceQ0T_w/exec';let API=localStorage.getItem('alqsa_backend_url')||DEFAULT_API,token=sessionStorage.getItem('alqsa_admin_token')||'';let cache={products:[],orders:[],categories:[],banners:[],offers:[],settings:{}};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...payload})});const d=await r.json();if(!d.success)throw new Error(d.error||'Request failed');return d}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',2500)}
const sections=[['dashboard','Dashboard'],['products','Products'],['orders','Orders'],['banners','Banners'],['categories','Categories'],['offers','Offers'],['settings','Settings'],['security','Security']];
function nav(){const html=sections.map(([id,label])=>`<button class="navbtn" data-route="${id}">${label}</button>`).join('');$('#sidebar').innerHTML=html;$('#drawerNav').innerHTML=html;document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{location.hash=b.dataset.route;closeDrawer()})}
function go(){const r=location.hash.slice(1)||'dashboard';document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.route===r));({dashboard:dashboard,products:products,orders:orders,banners:banners,categories:categories,offers:offers,settings:settings,security:security}[r]||dashboard)()}
function showApp(){if(!token)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');nav();go()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').classList.add('hidden');try{const d=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username:$('#username').value.trim(),password:$('#password').value})}).then(r=>r.json());if(!d.success)throw new Error(d.error);token=d.token;sessionStorage.setItem('alqsa_admin_token',token);showApp()}catch(err){$('#loginErr').textContent=err.message;$('#loginErr').classList.remove('hidden')}};
$('#logout').onclick=async()=>{try{await api('logout')}catch(e){}sessionStorage.removeItem('alqsa_admin_token');token='';location.reload()};$('#hamb').onclick=()=>{$('#drawer').classList.add('open');$('#overlay').classList.add('open')};$('#closeDrawer').onclick=closeDrawer;$('#overlay').onclick=closeDrawer;function closeDrawer(){$('#drawer').classList.remove('open');$('#overlay').classList.remove('open')};$('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.setItem('alqsa_theme',n)};document.documentElement.dataset.theme=localStorage.getItem('alqsa_theme')||'light';window.onhashchange=go;
function dashboard(){api('dashboard').then(d=>{const s=d.stats;$('#content').innerHTML=`<div class="sectionhead"><div><h2>Dashboard</h2><div class="muted">আজকের সারাংশ</div></div></div><div class="grid stats">${[['Today Orders',s.todayOrders],['New',s.newOrders],['Confirmed',s.confirmed],['Processing',s.processing],['Shipped',s.shipped],['Delivered',s.delivered],['Cancelled',s.cancelled],['Today Sales',money(s.todaySales)]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card"><div class="sectionhead"><h3>Recent Orders</h3><button class="btn secondary" onclick="location.hash='orders'">সব অর্ডার</button></div>${d.recentOrders.length?`<div class="tablewrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>${d.recentOrders.map(o=>`<tr><td>${esc(o['Order ID'])}</td><td>${esc(o['Customer Name'])}<br>${esc(o.Phone)}</td><td>${money(o.Total)}</td><td><span class="pill">${esc(o.Status)}</span></td></tr>`).join('')}</table></div>`:'<div class="muted">No orders yet.</div>'}</div>`}).catch(err=>$('#content').innerHTML=`<div class="notice">${esc(err.message)}</div>`) }
function products(){api('listProducts').then(d=>{cache.products=d.products||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Products</h2><div class="muted">ID server থেকে তৈরি হবে; ID কখনো reuse হবে না।</div></div><button class="btn" onclick="productForm()">+ Product</button></div><div class="card"><div class="formgrid"><input id="pq" class="input" placeholder="Search ID / name / brand / category" oninput="renderProductRows()"><select id="pcat" class="select" onchange="renderProductRows()"><option value="">All categories</option>${cacheCategoriesOptions()}</select><select id="pstatus" class="select" onchange="renderProductRows()"><option value="">All status</option><option>active</option><option>hidden</option><option>out-of-stock</option></select><select id="psort" class="select" onchange="renderProductRows()"><option value="sort">Sort order</option><option value="priceLow">Price low</option><option value="priceHigh">Price high</option><option value="name">Name</option></select></div></div><div id="productRows"></div>`;renderProductRows()}).catch(err=>toast(err.message))}
function cacheCategoriesOptions(){return (cache.categories||[]).map(c=>`<option>${esc(c.Name)}</option>`).join('')}
function categoryOptions(selected){return (cache.categories||[]).map(c=>'<option '+(selected===c.Name?'selected':'')+'>'+esc(c.Name)+'</option>').join('')}
function statusOptions(selected){return ['New','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>'<option '+(s===selected?'selected':'')+'>'+s+'</option>').join('')}
function themeOptions(selected){return ['Classic Slide','Fade','Zoom','Ken Burns','Vertical Slide','Soft Reveal'].map(x=>'<option '+(x===selected?'selected':'')+'>'+x+'</option>').join('')}
function renderProductRows(){let a=[...cache.products],q=($('#pq')?.value||'').toLowerCase(),cat=$('#pcat')?.value||'',st=$('#pstatus')?.value||'',so=$('#psort')?.value||'sort';a=a.filter(p=>(p['Product ID']+' '+p.Name+' '+p.Brand+' '+p.Category+' '+p.Subcategory).toLowerCase().includes(q));if(cat)a=a.filter(p=>p.Category===cat);if(st)a=a.filter(p=>p.Status===st);if(so==='priceLow')a.sort((x,y)=>Number(x.Price)-Number(y.Price));if(so==='priceHigh')a.sort((x,y)=>Number(y.Price)-Number(x.Price));if(so==='name')a.sort((x,y)=>String(x.Name).localeCompare(String(y.Name),'bn'));$('#productRows').innerHTML=a.map(p=>`<div class="card"><div class="sectionhead"><div><b>${esc(p.Name)}</b><div class="muted">${esc(p['Product ID'])} · ${esc(p.Category)} · ${esc(p.Subcategory)}</div></div><span class="pill">${esc(p.Status)}</span></div><div class="actions"><span>${money(p.Price)} ${Number(p.MRP)>Number(p.Price)?'<del>'+money(p.MRP)+'</del>':''}</span><span class="muted">Stock: ${Number(p.Stock)||0}</span><button class="btn secondary" onclick='productForm(${JSON.stringify(p)})'>Edit</button><button class="btn danger" onclick="deleteProduct('${esc(p['Product ID'])}')">Delete</button></div></div>`).join('')||'<div class="card muted">No products found.</div>'}
async function productForm(p={}){if(!cache.categories.length)try{cache.categories=(await api('listCategories')).categories||[]}catch(e){}const imgs=(()=>{try{return JSON.parse(p.Images||'[]')}catch(e){return[]}})();$('#content').insertAdjacentHTML('afterbegin',`<div class="card" id="productEditor"><div class="sectionhead"><h3>${p['Product ID']?'Edit':'Add'} Product</h3><button class="btn secondary" onclick="$('#productEditor').remove()">Close</button></div><div class="formgrid"><label>Name<input id="pn" class="input" value="${esc(p.Name||'')}"></label><label>Brand<input id="pb" class="input" value="${esc(p.Brand||'')}"></label><label>Category<select id="pc" class="select">${categoryOptions(p.Category)}</select></label><label>Subcategory<input id="psub" class="input" value="${esc(p.Subcategory||'')}"></label><label>Price<input id="pp" type="number" class="input" value="${Number(p.Price||0)}"></label><label>MRP<input id="pm" type="number" class="input" value="${Number(p.MRP||0)}"></label><label>Discount<input id="pd" type="number" class="input" value="${Number(p.Discount||0)}"></label><label>Stock<input id="pst" type="number" class="input" value="${Number(p.Stock||0)}"></label><label>Status<select id="pstat" class="select"><option ${p.Status==='active'?'selected':''}>active</option><option ${p.Status==='hidden'?'selected':''}>hidden</option><option ${p.Status==='out-of-stock'?'selected':''}>out-of-stock</option></select></label><label>Sort order<input id="pso" type="number" class="input" value="${Number(p['Sort Order']||0)}"></label><label class="span2">Image URL 1<input id="pi1" class="input" value="${esc(imgs[0]||'')}"></label><label>Image URL 2<input id="pi2" class="input" value="${esc(imgs[1]||'')}"></label><label>Image URL 3<input id="pi3" class="input" value="${esc(imgs[2]||'')}"></label><label>Image URL 4<input id="pi4" class="input" value="${esc(imgs[3]||'')}"></label><label class="span2">Description<textarea id="pdesc" class="textarea">${esc(p.Description||'')}</textarea></label></div><div class="actions"><button class="btn" onclick='saveProduct(${JSON.stringify(p)})'>Save Product</button></div></div>`)}
async function saveProduct(p={}){try{let id=p['Product ID']||'';if(!id){const d=await api('allocateProductId',{category:$('#pc').value});id=d.productId}await api('saveProduct',{productId:id,name:$('#pn').value,brand:$('#pb').value,category:$('#pc').value,subcategory:$('#psub').value,price:Number($('#pp').value)||0,mrp:Number($('#pm').value)||0,discount:Number($('#pd').value)||0,stock:Number($('#pst').value)||0,status:$('#pstat').value,sortOrder:Number($('#pso').value)||0,images:[$('#pi1').value,$('#pi2').value,$('#pi3').value,$('#pi4').value].map(x=>x.trim()).filter(Boolean),description:$('#pdesc').value,featured:false});toast('Product saved');products()}catch(e){toast(e.message)}}
async function deleteProduct(id){if(!confirm('Product delete করবেন?'))return;try{await api('deleteProduct',{productId:id});toast('Deleted');products()}catch(e){toast(e.message)}}
function orders(){api('listOrders',{search:'',status:'all'}).then(d=>{cache.orders=d.orders||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Orders</h2><div class="muted">New → Confirmed → Processing → Shipped → Delivered / Cancelled</div></div></div><div class="card"><div class="formgrid"><input id="oq" class="input" placeholder="Search Order ID / customer / phone" oninput="renderOrders()"><select id="os" class="select" onchange="renderOrders()"><option>all</option><option>New</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div></div><div id="orderRows"></div>`;renderOrders()}).catch(e=>toast(e.message))}
function renderOrders(){let a=[...cache.orders],q=($('#oq')?.value||'').toLowerCase(),st=$('#os')?.value||'all';a=a.filter(o=>(o['Order ID']+' '+o['Customer Name']+' '+o.Phone).toLowerCase().includes(q));if(st!=='all')a=a.filter(o=>o.Status===st);$('#orderRows').innerHTML=a.map(o=>`<div class="card"><div class="sectionhead"><div><b>${esc(o['Order ID'])}</b><div class="muted">${esc(o['Customer Name'])} · ${esc(o.Phone)}</div></div><select class="select" onchange="changeOrder('${esc(o['Order ID'])}',this.value)">${statusOptions(o.Status)}</select></div><div class="muted">${esc(o.Address)}</div><div class="actions" style="margin-top:8px"><b>${money(o.Total)}</b><button class="btn secondary" onclick='orderEditor(${JSON.stringify(o)})'>Details / Edit</button></div></div>`).join('')||'<div class="card muted">No orders.</div>'}
async function changeOrder(id,status){try{await api('updateOrder',{orderId:id,status});toast('Status updated');orders()}catch(e){toast(e.message)}}
function orderEditor(o){$('#content').insertAdjacentHTML('afterbegin',`<div class="card" id="orderEditor"><div class="sectionhead"><h3>${esc(o['Order ID'])}</h3><button class="btn secondary" onclick="$('#orderEditor').remove()">Close</button></div><div class="formgrid"><label>Name<input id="oeName" class="input" value="${esc(o['Customer Name'])}"></label><label>Phone<input id="oePhone" class="input" value="${esc(o.Phone)}"></label><label>WhatsApp<input id="oeWa" class="input" value="${esc(o.WhatsApp)}"></label><label>Zone<input id="oeZone" class="input" value="${esc(o['Delivery Zone'])}"></label><label class="span2">Address<textarea id="oeAddress" class="textarea">${esc(o.Address)}</textarea></label><label>Delivery charge<input id="oeDelivery" type="number" class="input" value="${Number(o['Delivery Charge'])||0}"></label><label>Payment<input id="oePay" class="input" value="${esc(o['Payment Method'])}"></label><label class="span2">Note<textarea id="oeNote" class="textarea">${esc(o.Note)}</textarea></label></div><div class="actions"><button class="btn" onclick="saveOrderEdit('${esc(o['Order ID'])}')">Save</button><button class="btn secondary" onclick="window.print()">Print invoice / courier slip</button></div></div>`)}
async function saveOrderEdit(id){try{await api('editOrder',{orderId:id,customerName:$('#oeName').value,phone:$('#oePhone').value,whatsapp:$('#oeWa').value,deliveryZone:$('#oeZone').value,address:$('#oeAddress').value,deliveryCharge:Number($('#oeDelivery').value)||0,paymentMethod:$('#oePay').value,note:$('#oeNote').value});toast('Order updated');orders()}catch(e){toast(e.message)}}
function categories(){api('listCategories').then(d=>{cache.categories=d.categories||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Categories</h2><div class="muted">Active/inactive, subcategories, pin and sort</div></div><button class="btn" onclick="categoryEditor()">+ Category</button></div><div id="catRows">${cache.categories.map(categoryCard).join('')}</div>`}).catch(e=>toast(e.message))}
function categoryCard(c){return `<div class="card"><div class="sectionhead"><div><b>${esc(c.Name)}</b><div class="muted">${esc(String(c.Subcategories||'').replaceAll('|',' · '))}</div></div><span class="pill">${c.Active}</span></div><div class="actions"><button class="btn secondary" onclick='categoryEditor(${JSON.stringify(c)})'>Edit</button><button class="btn danger" onclick="deleteCategory('${esc(c['Category ID'])}')">Delete</button></div></div>`}
function bannerCard(b){return `<div class="card"><div class="sectionhead"><div><b>${esc(b.Title)}</b><div class="muted">${esc(b.Theme)} · ${b.Active}</div></div><span class="pill">${b.Active==='TRUE'?'Active':'Hidden'}</span></div><div class="actions"><button class="btn secondary" onclick='bannerEditor(${JSON.stringify(b)})'>Edit</button><button class="btn danger" onclick="deleteBanner('${esc(b['Banner ID'])}')">Delete</button></div></div>`}
function offerAdminCard(o){return `<div class="card"><div class="sectionhead"><div><b>${esc(o.Title)}</b><div class="muted">${esc(o.Subtitle)} · ${o.Active}</div></div><span class="pill">${o['Discount Value']||0}${o['Discount Type']==='percent'?'%':''}</span></div><div class="actions"><button class="btn secondary" onclick='offerEditor(${JSON.stringify(o)})'>Edit</button><button class="btn danger" onclick="deleteOffer('${esc(o['Offer ID'])}')">Delete</button></div></div>`}
function categoryEditor(c={}){$('#content').insertAdjacentHTML('afterbegin',`<div class="card" id="catEditor"><div class="sectionhead"><h3>${c['Category ID']?'Edit':'Add'} Category</h3><button class="btn secondary" onclick="$('#catEditor').remove()">Close</button></div><div class="formgrid"><label>Name<input id="cn" class="input" value="${esc(c.Name||'')}"></label><label>Sort order<input id="cso" type="number" class="input" value="${Number(c['Sort Order']||0)}"></label><label>Subcategories<input id="csub" class="input" value="${esc(String(c.Subcategories||'').replaceAll('|',', '))}"></label><label>Active<select id="ca" class="select"><option value="true" ${c.Active!=='FALSE'?'selected':''}>Active</option><option value="false" ${c.Active==='FALSE'?'selected':''}>Hidden</option></select></label><label>Top pin<select id="cpin" class="select"><option value="false" ${c['Top Pin']!=='TRUE'?'selected':''}>No</option><option value="true" ${c['Top Pin']==='TRUE'?'selected':''}>Yes</option></select></label></div><button class="btn" onclick='saveCategory(${JSON.stringify(c)})'>Save Category</button></div>`)}
async function saveCategory(c={}){try{await api('saveCategory',{categoryId:c['Category ID']||'',name:$('#cn').value,subcategories:$('#csub').value.split(',').map(x=>x.trim()).filter(Boolean),active:$('#ca').value==='true',topPin:$('#cpin').value==='true',sortOrder:Number($('#cso').value)||0});toast('Category saved');categories()}catch(e){toast(e.message)}}
async function deleteCategory(id){if(!confirm('Category delete করবেন?'))return;try{await api('deleteCategory',{categoryId:id});categories()}catch(e){toast(e.message)}}
function banners(){api('listBanners').then(d=>{cache.banners=d.banners||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Banners</h2><div class="muted">Slide, Fade, Zoom, Ken Burns, Vertical Slide, Soft Reveal</div></div><button class="btn" onclick="bannerEditor()">+ Banner</button></div>${cache.banners.length?cache.banners.map(bannerCard).join(''):'<div class="card muted">No banners.</div>'}`}).catch(e=>toast(e.message))}
function bannerEditor(b={}){$('#content').insertAdjacentHTML('afterbegin',`<div class="card" id="bannerEditor"><div class="sectionhead"><h3>${b['Banner ID']?'Edit':'Add'} Banner</h3><button class="btn secondary" onclick="$('#bannerEditor').remove()">Close</button></div><div class="formgrid"><label>Title<input id="bt" class="input" value="${esc(b.Title||'')}"></label><label>Button text<input id="bb" class="input" value="${esc(b['Button Text']||'Shop now')}"></label><label>Image URL<input id="bi" class="input" value="${esc(b.Image||'')}"></label><label>Link<input id="bl" class="input" value="${esc(b.Link||'')}"></label><label>Theme<select id="btheme" class="select">${themeOptions(b.Theme)}</select></label><label>Duration ms<input id="bd" type="number" class="input" value="${Number(b.Duration||5000)}"></label><label>Active<select id="ba" class="select"><option value="true" ${b.Active!=='FALSE'?'selected':''}>Active</option><option value="false" ${b.Active==='FALSE'?'selected':''}>Hidden</option></select></label><label>Sort order<input id="bso" type="number" class="input" value="${Number(b['Sort Order']||0)}"></label></div><button class="btn" onclick='saveBanner(${JSON.stringify(b)})'>Save Banner</button></div>`)}
async function saveBanner(b){try{await api('saveBanner',{bannerId:b['Banner ID']||'',title:$('#bt').value,buttonText:$('#bb').value,image:$('#bi').value,link:$('#bl').value,theme:$('#btheme').value,duration:Number($('#bd').value)||5000,active:$('#ba').value==='true',sortOrder:Number($('#bso').value)||0,autoplay:true,transition:'slide',arrows:true,dots:true,swipe:true,pause:false});toast('Banner saved');banners()}catch(e){toast(e.message)}}
async function deleteBanner(id){if(!confirm('Banner delete করবেন?'))return;try{await api('deleteBanner',{bannerId:id});banners()}catch(e){toast(e.message)}}
function offers(){api('listOffers').then(d=>{cache.offers=d.offers||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Offers</h2><div class="muted">অফার page-এর content এখান থেকে নিয়ন্ত্রণ করুন</div></div><button class="btn" onclick="offerEditor()">+ Offer</button></div>${cache.offers.length?cache.offers.map(offerAdminCard).join(''):'<div class="card muted">No offers.</div>'}`}).catch(e=>toast(e.message))}
function offerEditor(o={}){$('#content').insertAdjacentHTML('afterbegin',`<div class="card" id="offerEditor"><div class="sectionhead"><h3>${o['Offer ID']?'Edit':'Add'} Offer</h3><button class="btn secondary" onclick="$('#offerEditor').remove()">Close</button></div><div class="formgrid"><label>Title<input id="ot" class="input" value="${esc(o.Title||'')}"></label><label>Subtitle<input id="osub" class="input" value="${esc(o.Subtitle||'')}"></label><label class="span2">Description<textarea id="odesc" class="textarea">${esc(o.Description||'')}</textarea></label><label>Image URL<input id="oi" class="input" value="${esc(o.Image||'')}"></label><label>Link<input id="ol" class="input" value="${esc(o.Link||'')}"></label><label>Button text<input id="ob" class="input" value="${esc(o['Button Text']||'Shop now')}"></label><label>Discount type<select id="odt" class="select"><option value="none">None</option><option value="percent">Percent</option><option value="fixed">Fixed</option></select></label><label>Discount value<input id="odv" type="number" class="input" value="${Number(o['Discount Value']||0)}"></label><label>Start<input id="osta" class="input" value="${esc(o['Start At']||'')}"></label><label>End<input id="oend" class="input" value="${esc(o['End At']||'')}"></label><label>Active<select id="oa" class="select"><option value="true" ${o.Active!=='FALSE'?'selected':''}>Active</option><option value="false" ${o.Active==='FALSE'?'selected':''}>Hidden</option></select></label><label>Featured<select id="of" class="select"><option value="false" ${o.Featured!=='TRUE'?'selected':''}>No</option><option value="true" ${o.Featured==='TRUE'?'selected':''}>Yes</option></select></label></div><button class="btn" onclick='saveOffer(${JSON.stringify(o)})'>Save Offer</button></div>`);$('#odt').value=o['Discount Type']||'none'}
async function saveOffer(o){try{await api('saveOffer',{offerId:o['Offer ID']||'',title:$('#ot').value,subtitle:$('#osub').value,description:$('#odesc').value,image:$('#oi').value,link:$('#ol').value,buttonText:$('#ob').value,discountType:$('#odt').value,discountValue:Number($('#odv').value)||0,startAt:$('#osta').value,endAt:$('#oend').value,active:$('#oa').value==='true',featured:$('#of').value==='true',sortOrder:0});toast('Offer saved');offers()}catch(e){toast(e.message)}}
async function deleteOffer(id){if(!confirm('Offer delete করবেন?'))return;try{await api('deleteOffer',{offerId:id});offers()}catch(e){toast(e.message)}}
function settings(){api('getSettings').then(d=>{cache.settings=d.settings||{};const s=cache.settings;$('#content').innerHTML=`<div class="sectionhead"><div><h2>Settings</h2><div class="muted">শুধু Settings-এর ভেতর operational configuration</div></div></div><div class="tabs"><button class="tab active" onclick="settingPane('branding')">Branding</button><button class="tab" onclick="settingPane('delivery')">Delivery</button><button class="tab" onclick="settingPane('contact')">Contact</button><button class="tab" onclick="settingPane('about')">About & FAQ</button><button class="tab" onclick="settingPane('backend')">Backend</button></div><div id="settingsPane"></div>`;settingPane('branding')}).catch(e=>toast(e.message))}
function settingPane(k){const s=cache.settings||{},p=$('#settingsPane');if(k==='branding')p.innerHTML=`<div class="card"><div class="formgrid"><label>Shop name<input id="shopName" class="input" value="${esc(s.shopName||'')}"></label><label>Font<input id="shopFont" class="input" value="${esc(s.shopFont||'Hind Siliguri')}"></label><label>Logo URL<input id="logo" class="input" value="${esc(s.logo||'')}"></label><label>Logo visible<select id="logoVisible" class="select"><option value="true">Yes</option><option value="false">No</option></select></label><label>Show shop name<select id="showShopName" class="select"><option value="true">Yes</option><option value="false">No</option></select></label></div><button class="btn" onclick="saveSettingKeys(['shopName','shopFont','logo','logoVisible','showShopName'])">Save Branding</button></div>`;else if(k==='delivery')p.innerHTML=`<div class="card"><div class="formgrid"><label>Inside Cox's Bazar charge<input id="insideCharge" type="number" class="input" value="${Number(s.insideCharge||0)}"></label><label>Outside Cox's Bazar charge<input id="outsideCharge" type="number" class="input" value="${Number(s.outsideCharge||0)}"></label><label>Free delivery threshold<input id="freeThreshold" type="number" class="input" value="${Number(s.freeThreshold||0)}"></label><label>Inside active<select id="insideActive" class="select"><option value="true">Active</option><option value="false">Inactive</option></select></label><label>Outside active<select id="outsideActive" class="select"><option value="true">Active</option><option value="false">Inactive</option></select></label></div><button class="btn" onclick="saveSettingKeys(['insideCharge','outsideCharge','freeThreshold','insideActive','outsideActive'])">Save Delivery</button></div>`;else if(k==='contact')p.innerHTML=`<div class="card"><div class="formgrid"><label>WhatsApp<input id="whatsapp" class="input" value="${esc(s.whatsapp||'')}" ></label><label>Messenger<input id="messenger" class="input" value="${esc(s.messenger||'')}"></label><label>Facebook<input id="facebook" class="input" value="${esc(s.facebook||'')}"></label><label>TikTok<input id="tiktok" class="input" value="${esc(s.tiktok||'')}"></label><label>Hotline<input id="hotline" class="input" value="${esc(s.hotline||'')}"></label><label>Address<input id="address" class="input" value="${esc(s.address||'')}"></label></div><button class="btn" onclick="saveSettingKeys(['whatsapp','messenger','facebook','tiktok','hotline','address'])">Save Contact</button></div>`;else if(k==='about')p.innerHTML=`<div class="card"><label>About<textarea id="about" class="textarea">${esc(s.about||'')}</textarea></label><br><label>FAQ<textarea id="faq" class="textarea">${esc(s.faq||'')}</textarea></label><br><button class="btn" onclick="saveSettingKeys(['about','faq'])">Save Content</button></div>`;else p.innerHTML=`<div class="card"><div class="notice">Telegram token frontend-এ নেই। শুধু Web App URL এখানে রাখুন।</div><label>Apps Script Web App URL<input id="backendUrl" class="input" value="${esc(API)}"></label><div class="actions" style="margin-top:10px"><button class="btn" onclick="saveBackend()">Save URL</button><button class="btn secondary" onclick="testBackend()">Test Connection</button><button class="btn secondary" onclick="testTelegram()">Test Telegram</button></div><pre id="backendResult" class="muted"></pre></div>`;['logoVisible','showShopName','insideActive','outsideActive'].forEach(id=>{if($('#'+id))$('#'+id).value=s[id]||'true'})}
async function saveSettingKeys(keys){const out={};keys.forEach(k=>out[k]=$('#'+k).value);try{await api('saveSettings',{settings:out});Object.assign(cache.settings,out);toast('Settings saved')}catch(e){toast(e.message)}}
function saveBackend(){API=$('#backendUrl').value.trim();localStorage.setItem('alqsa_backend_url',API);toast('Backend URL saved')}
async function testBackend(){try{const r=await fetch(API);const d=await r.json();$('#backendResult').textContent=JSON.stringify(d,null,2)}catch(e){$('#backendResult').textContent='Failed: '+e.message}}
async function testTelegram(){try{const d=await api('testTelegram');$('#backendResult').textContent=JSON.stringify(d,null,2);toast('Telegram test sent')}catch(e){toast(e.message)}}
function security(){$('#content').innerHTML=`<div class="sectionhead"><div><h2>Security</h2><div class="muted">Current password required</div></div></div><div class="card"><div class="formgrid"><label>Current User ID<input id="cu" class="input"></label><label>Current Password<input id="cp" type="password" class="input"></label><label>New User ID<input id="nu" class="input"></label><label>New Password<input id="np" type="password" class="input"></label></div><button class="btn" onclick="changeCreds()">Change Credentials</button></div>`}
async function changeCreds(){try{const d=await api('changeCredentials',{currentUser:$('#cu').value,currentPassword:$('#cp').value,newUser:$('#nu').value,newPassword:$('#np').value});toast(d.message);setTimeout(()=>location.reload(),700)}catch(e){toast(e.message)}}
if(token)showApp();
</script></body></html>
