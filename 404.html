<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al Aqsa Burmese Shop</title></head><body><script>
(function(){
  var path=location.pathname, parts=path.split('/').filter(Boolean);
  var base=(location.hostname.endsWith('.github.io')&&parts.length>1)?'/'+parts[0]:'/';
  var rel=path.slice(base.length).replace(/^\/+|\/+$/g,'');
  var q='';
  if(/^product\//.test(rel)){q='?route=product&product='+encodeURIComponent(decodeURIComponent(rel.split('/')[1]||''));}
  else if(/^offers\/?$/.test(rel)){q='?route=offers';}
  else if(/^combo\/?$/.test(rel)){q='?route=combo';}
  else if(/^category\//.test(rel)){var a=rel.split('/');q='?route=category&cat='+encodeURIComponent(decodeURIComponent(a[1]||''))+(a[2]?'&sub='+encodeURIComponent(decodeURIComponent(a[2])):'');}
  else{q='';}
  location.replace(base+'/'+q);
})();
</script></body></html>
